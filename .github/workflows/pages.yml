#
# Builds the documentation as a Jekyll site, adds the Dokka API reference, and
# deploys it to GitHub Pages.
#
# The same arrangement as swift-oidc-caep-native-app's pages.yml (and
# oidc-caep-client's and iya-sts's before it): GitHub's own configure-pages,
# jekyll-build-pages and deploy-pages. It needs no secret (the pages/id-token
# permissions below authorise the deployment).
#
# WHAT THE SITE IS MADE OF. docs/ is the site's frame (config, layouts, sidebar,
# styles) and its own pages. Two documents are the repository's own files,
# written once and read in the repository as well:
#
#   Documentation/android-app-guide.md  ->  android-app-guide.html
#   Documentation/reference.md          ->  reference.html
#
# And the API reference is generated by Dokka from the library's KDoc comments
# and library/Module.md, at /api/: see the `api` job below. Where the Swift
# library needs a macOS runner for DocC, Dokka runs on Linux.
#
# The two documents are copied into a staging copy of docs/ before Jekyll runs.
# Their few links that point outside Documentation/ (`../docs/demo.md`,
# `../demo`, `../scripts/...`) are rewritten there: to the page beside them, or
# to the file on GitHub at the commit being built. A guard then fails the build
# if any `](../` link is left, which would be a 404 on the site.
#
# BEFORE THE FIRST RUN, Pages must exist for the repository and build from GitHub
# Actions. The workflow's token cannot create it (`Resource not accessible by
# integration`, as iya-sts found); somebody with admin on the repository does it
# once:
#
#     gh api -X POST repos/rcbj/android-oidc-caep-native-app/pages -f build_type=workflow
#
# or Settings → Pages → Source: GitHub Actions. `enablement: true` is kept for a
# fork whose runner may have that right.
name: Deploy docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - Documentation/**
      # The Dokka reference is generated from the source and its module page.
      - library/src/main/**
      - library/Module.md
      - README.md
      - .github/workflows/pages.yml
  workflow_dispatch:

# The three permissions the official flow needs, and no more.
permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a queued one is not cancelled: a half-finished
# deployment is a site serving a mixture of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # THE API REFERENCE. Dokka 2 (`dokkaGeneratePublicationHtml`) reads the
  # library's KDoc and writes static HTML to library/build/dokka/html, handed to
  # the build job as an artifact and served under /<repository>/api/.
  api:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4

      - name: Generate the API reference
        run: |
          set -euo pipefail
          ./gradlew --no-daemon :library:dokkaGeneratePublicationHtml
          if [ ! -f library/build/dokka/html/index.html ]; then
            echo "library/build/dokka/html/index.html is missing." >&2
            exit 1
          fi
          rm -rf _site_api
          mkdir -p _site_api
          cp -r library/build/dokka/html _site_api/api
          echo "Dokka: $(find _site_api/api -name '*.html' | wc -l) page(s)."

      # Dokka names some files after operators and backticked names, so the
      # reference travels as one tarball rather than as an artifact tree.
      - name: Pack the API reference
        run: tar -czf dokka-api.tar.gz _site_api

      - name: Upload the API reference
        uses: actions/upload-artifact@v4
        with:
          name: dokka-api
          path: dokka-api.tar.gz
          if-no-files-found: error
          retention-days: 1

  build:
    needs: api
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stage the site
        env:
          BLOB: ${{ github.server_url }}/${{ github.repository }}/blob/${{ github.sha }}
        run: |
          set -euo pipefail
          rm -rf _site_src
          cp -r docs _site_src

          # Each page gets front matter for its <title>; the markdown below it is the file as written.
          # A link to a page of docs/ goes to that page; any other link out of Documentation/ goes to
          # the file on GitHub. Links between the two documents (`reference.md`) work as they are.
          rewrite() {
            sed -e 's#](\.\./docs/\([A-Za-z0-9_-]*\)\.md#](\1.md#g' \
                -e "s#](\.\./#](${BLOB}/#g" \
                "$1"
          }
          {
            printf -- '---\ntitle: Building a native Android app\n---\n\n'
            rewrite Documentation/android-app-guide.md
          } > _site_src/android-app-guide.md
          {
            printf -- '---\ntitle: API reference\n---\n\n'
            rewrite Documentation/reference.md
          } > _site_src/reference.md

          # A relative link that still climbs out of the site would be a 404 once published.
          if grep -nE '\]\(\.\./' _site_src/*.md; then
            echo "A link above points outside the site; rewrite it in this step." >&2
            exit 1
          fi

      # `source: ./_site_src`: the staged copy, so nothing else in the repository is published.
      # The base URL comes from configure-pages, not from docs/_config.yml.
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./_site_src
          destination: ./_site

      # jekyll-build-pages succeeds on missing pages too, and the symptom is a blank or partial site.
      - name: Check the site
        run: |
          for page in index.html android-app-guide.html reference.html demo.html development.html android.html; do
            if [ ! -f "_site/$page" ]; then
              echo "_site/$page is missing." >&2
              ls -la _site || true
              exit 1
            fi
          done
          echo "Built $(find _site -name '*.html' | wc -l) page(s)."

      # The Dokka pages from the api job. Copied in after Jekyll, which would otherwise process
      # or skip them; Jekyll's _site belongs to root, hence sudo.
      - name: Download the API reference
        uses: actions/download-artifact@v4
        with:
          name: dokka-api
          path: .

      - name: Unpack the API reference
        run: tar -xzf dokka-api.tar.gz

      - name: Add the API reference to the site
        run: |
          if [ ! -f "_site_api/api/index.html" ]; then
            echo "_site_api/api/index.html is missing." >&2
            exit 1
          fi
          sudo mkdir -p _site/api
          sudo cp -r _site_api/api/. _site/api/
          echo "api: $(find _site/api -name '*.html' | wc -l) page(s)."

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
