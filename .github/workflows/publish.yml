name: publish

on:
  workflow_run:
    workflows: ["Tests"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# One release at a time: each reads the version the one before it took.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    # The Tests workflow has already succeeded for this commit on main. Release only when that commit is a pull
    # request merged into main; a direct push stays unreleased. .github/scripts/release_decision.py (the same script
    # as the other client libraries) picks the version: VERSION when it is ahead of what is published, one patch
    # higher when the library's shipped files changed since the last release's tag, and otherwise no release at all,
    # so a change to tests, the demo, or the docs ships nothing. The version reaches Gradle as -PreleaseVersion and is
    # never committed.
    #
    # Only library/ is published (com.iyasec:oidc-caep-android: the AAR, its sources, a Dokka javadoc jar, and the
    # POM, all signed); the demo never is. Maven Central has no trusted publishing, so this job uses four repository
    # secrets: the Central Portal user token and the release signing key.
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Require a pull request merged into main
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -eu
          count=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${SHA}/pulls" \
            --jq '[.[] | select(.base.ref == "main" and .merged_at != null)] | length')
          if [ "$count" = "0" ]; then
            echo "This commit on main did not come from a merged pull request."
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      # Every tag: the last release's tag is what the decision compares with.
      - uses: actions/checkout@v4
        if: steps.gate.outputs.publish == 'true'
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this commit is a release
        id: decide
        if: steps.gate.outputs.publish == 'true'
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python3 .github/scripts/release_decision.py decide maven com.iyasec:oidc-caep-android "$SHA" \
            library VERSION gradle/libs.versions.toml ':(exclude)library/src/test'

      - uses: actions/setup-java@v4
        if: steps.decide.outputs.release == 'true'
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
        if: steps.decide.outputs.release == 'true'
        with:
          packages: 'platform-tools platforms;android-37.1 build-tools;36.0.0'

      - uses: gradle/actions/setup-gradle@v4
        if: steps.decide.outputs.release == 'true'

      # The plugin uploads to the Central Portal and releases the deployment once it validates.
      - name: Publish the library
        if: steps.decide.outputs.release == 'true'
        env:
          VERSION: ${{ steps.decide.outputs.version }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -eu
          test -n "$ORG_GRADLE_PROJECT_signingInMemoryKey" || { echo "GPG_PRIVATE_KEY is not set." >&2; exit 1; }
          ./gradlew --no-daemon --no-configuration-cache :library:publishAndReleaseToMavenCentral -PreleaseVersion="$VERSION"

      # Publishing and this step are one release: the tag it creates is the baseline the next decision compares with.
      - name: Create the tag and the GitHub Release
        if: steps.decide.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
          TAG: ${{ steps.decide.outputs.tag }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --target "$SHA" --title "$TAG" --generate-notes
