#
# Jekyll configuration for the android-oidc-caep-native-app documentation site,
# laid out like swift-oidc-caep-native-app's (and oidc-caep-client's before it):
# the `minima` theme GitHub Pages ships, with a sidebar drawn from
# _data/navigation.yml.
#
# ../.github/workflows/pages.yml builds it. This directory holds only the site's
# frame and its own pages. The guide and the reference are the repository's
# own files (Documentation/android-app-guide.md and Documentation/reference.md),
# copied in by the workflow, so each is written once and reads the same in the
# repository and on the site. The Dokka API reference is generated from the
# source and added at /api/. Nothing here is used by the Gradle build.
title: android-oidc-caep-native-app
tagline: documentation
description: >-
  An OpenID Connect public client for native Android apps, in Kotlin: PKCE,
  PAR, DPoP with an Android Keystore key, tokens encrypted at rest, several
  accounts per app, and a Shared Signals receiver with one handler per CAEP
  event.
theme: minima
show_excerpts: false

# The site is served under the repository name on github.io. Internal links are
# plain relative paths (`android-app-guide.md`), which work on the site and in
# the repository alike; the workflow passes the real base URL from
# configure-pages.
baseurl: "/android-oidc-caep-native-app"

# GitHub Pages wraps a page with no `layout:` in `default` and turns a link to
# `foo.md` into `foo.html`. Both are restated so a local `jekyll build` does the
# same as the published site.
defaults:
  - scope:
      path: ""
    values:
      layout: default
plugins:
  - jekyll-relative-links
